version: "2"
linters:
  default: standard
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # Test helpers: unchecked Close/Write/Encode on fakes and temp files.
      - path: _test\.go
        linters: [errcheck]
